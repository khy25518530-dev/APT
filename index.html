function ensureAnonymousAuth() {
  return new Promise((resolve, reject) => {
    const unsub = auth.onAuthStateChanged(
      (user) => {
        if (user) {
          unsub();
          resolve(user);
        } else {
          auth.signInAnonymously().catch(reject);
        }
      },
      reject
    );
  });
}

const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 헷갈리는 0/O, 1/I 제외
function generateHouseholdCode() {
  let code = "";
  for (let i = 0; i < 6; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return code;
}
const EMPTY_DATA = {
  moveInDate: null,
  totalContractPrice: "",
  costs: { contract: [], midpayment: [], option: [], balance: [], loan: [], appliance: [], furniture: [], interior: [], etc: [] },
  schedule: [],
  refs: {},
};
async function createHousehold(code, uid) {
  const ref = db.collection("households").doc(code);
  const existing = await ref.get();
  if (existing.exists) throw new Error("이미 사용 중인 코드예요. 다시 시도해주세요.");
  await ref.set({
    ...EMPTY_DATA,
    members: [uid],
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
  return code;
}
async function joinHousehold(code, uid) {
  const ref = db.collection("households").doc(code);
  const snap = await ref.get();
  if (!snap.exists) throw new Error("존재하지 않는 코드예요. 코드를 다시 확인해주세요.");
  await ref.set({ members: firebase.firestore.FieldValue.arrayUnion(uid), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  return code;
}
function subscribeHousehold(code, onData, onError) {
  const ref = db.collection("households").doc(code);
  return ref.onSnapshot((snap) => {
    if (!snap.exists) return;
    onData(snap.data());
  }, onError);
}
async function pushHouseholdUpdate(code, partialData) {
  const ref = db.collection("households").doc(code);
  await ref.set({ ...partialData, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
}

async function uploadRefPhoto(householdCode, categoryId, file) {
  const path = `households/${householdCode}/refs/${categoryId}/${Date.now()}-${file.name}`;
  const storageRef = storage.ref().child(path);
  await storageRef.put(file);
  return storageRef.getDownloadURL();
}

const CATEGORY_META = [

function categoryOf(id) {
  return CATEGORY_META.find((c) => c.id === id);
}
function itemNeeded(item, kind) {
  if (kind === "installment") return (item.principal || 0) + (item.interest || 0);
  return item.estimated || 0;
}
function itemPrepared(item, kind) {
  if (kind === "installment") return item.repaid || 0;
  return item.actual !== null && item.actual !== undefined ? item.actual : 0;
}

};
function formatWon(n) {
  if (n === null || n === undefined) return "-";
  return "₩" + n.toLocaleString();
}
function formatShort(n) {
  if (n === null || n === undefined) return "-";
  if (n === 0) return "0원";
  const eok = Math.floor(n / 100000000);
  const man = Math.floor((n % 100000000) / 10000);
  let s = "";
  if (eok > 0) s += `${eok}억`;
  if (man > 0) s += (s ? " " : "") + `${man.toLocaleString()}만원`;
  if (!s) s = `${n.toLocaleString()}원`;
  return s;
}
// ---- Helpers ----
function parseLocalDate(str) {
  if (!str) return null;
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function daysBetween(a, b) {
  const MS = 1000 * 60 * 60 * 24;
  const d1 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const d2 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((d2 - d1) / MS);
}
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function MoveplanApp({
  moveInDate,
  setMoveInDate,
  costs,
  setCosts,
  totalContractPrice,
  setTotalContractPrice,
  schedule,
  setSchedule,
  refs,
  setRefs,
  uploadPhoto,
  householdCode,
  onLeaveHousehold,
  myName,
  setMyName,
}) {
  const [view, setView] = useState("home"); // home | cost-list | cost-detail | schedule | settings

  const [selectedCategory, setSelectedCategory] = useState(null);
  const [detailTab, setDetailTab] = useState("items"); // items | refs
  const [refSheetOpen, setRefSheetOpen] = useState(false);
  const [refPhoto, setRefPhoto] = useState(null);
  const [refPhotoFile, setRefPhotoFile] = useState(null);
  const [refUploading, setRefUploading] = useState(false);
  const [refPrice, setRefPrice] = useState("");
  const [refMemo, setRefMemo] = useState("");
  const [refError, setRefError] = useState("");
  const [refViewing, setRefViewing] = useState(null); // ref being viewed full-size

  const [sheetOpen, setSheetOpen] = useState(false);
  const [sheetMode, setSheetMode] = useState("item"); // item | schedule
  const [editingId, setEditingId] = useState(null);
  const [formName, setFormName] = useState("");
  const [formEstimated, setFormEstimated] = useState("");
  const [formActual, setFormActual] = useState("");
  const [formPrincipal, setFormPrincipal] = useState("");
  const [formRepaid, setFormRepaid] = useState("");
  const [formInterest, setFormInterest] = useState("");
  const [formOffset, setFormOffset] = useState("");
  const [formError, setFormError] = useState("");

  const [confirm, setConfirm] = useState(null); // {message, onConfirm}
  const [settingsEditingDate, setSettingsEditingDate] = useState(false);
  const [settingsDraftDate, setSettingsDraftDate] = useState("");
  const [settingsDateError, setSettingsDateError] = useState("");

  // Calendar view
  const [calMonth, setCalMonth] = useState(null); // { year, month(0-idx) }
  const [selectedDay, setSelectedDay] = useState(null);

  function buildDefaultSchedule() {
    return SCHEDULE_TEMPLATE.map((t, i) => ({
      id: "s" + i,
      title: t.title,
      offset: t.offset,
      categoryId: t.categoryId,
      completed: false,
    }));
  }

  // ---------- Derived data ----------
  const contractSum = useMemo(() => (costs.contract || []).reduce((a, i) => a + (i.principal || 0), 0), [costs.contract]);
  const midpaymentSum = useMemo(() => (costs.midpayment || []).reduce((a, i) => a + (i.principal || 0), 0), [costs.midpayment]);
  const balanceAuto = useMemo(() => {
    const tcp = Number(totalContractPrice) || 0;
    return Math.max(tcp - contractSum - midpaymentSum, 0);
  }, [totalContractPrice, contractSum, midpaymentSum]);

  // 잔금은 사용자가 직접 항목을 만드는 게 아니라, 총 분양가에서 계약금/중도금을 뺀 값으로 자동 유지됨
  useEffect(() => {
    setCosts((prev) => {
      const existing = (prev.balance || [])[0];
      if (existing && existing.id === "balance-auto" && existing.estimated === balanceAuto) return prev;
      return {
        ...prev,
        balance: [{ id: "balance-auto", name: "잔금", estimated: balanceAuto, actual: existing ? existing.actual : null }],
      };
    });
  }, [balanceAuto]);

  const totals = useMemo(() => {
    let needed = 0,
      prepared = 0;
    CATEGORY_META.forEach((c) => {
      (costs[c.id] || []).forEach((item) => {
        needed += itemNeeded(item, c.kind);
        prepared += itemPrepared(item, c.kind);
      });
    });
    return { needed, prepared, remaining: needed - prepared };
  }, [costs]);

  const dday = useMemo(() => {
    if (!moveInDate) return null;
    return daysBetween(new Date(), parseLocalDate(moveInDate));
  }, [moveInDate]);

  const scheduleWithDates = useMemo(() => {
    if (!moveInDate) return schedule.map((s) => ({ ...s, date: null, overdue: false }));
    const move = parseLocalDate(moveInDate);
    return schedule.map((s) => {
      const d = new Date(move);
      d.setDate(d.getDate() - s.offset);
      const overdue = !s.completed && daysBetween(d, new Date()) > 0;
      return { ...s, date: d, overdue };
    });
  }, [schedule, moveInDate]);

  const upcoming = useMemo(() => {
    return scheduleWithDates
      .filter((s) => !s.completed)
      .sort((a, b) => a.offset - b.offset)
      .slice(0, 3);
  }, [scheduleWithDates]);

  const progress = useMemo(() => {
    if (schedule.length === 0) return 0;
    return Math.round((schedule.filter((s) => s.completed).length / schedule.length) * 100);
  }, [schedule]);

  const earliestScheduleDate = useMemo(() => {
    if (scheduleWithDates.length === 0) return moveInDate ? parseLocalDate(moveInDate) : new Date();
    return scheduleWithDates.reduce((min, s) => (s.date < min ? s.date : min), scheduleWithDates[0].date);
  }, [scheduleWithDates, moveInDate]);

  function shiftMonth(delta) {
    setCalMonth((prev) => {
      const base = prev || { year: earliestScheduleDate.getFullYear(), month: earliestScheduleDate.getMonth() };
      const d = new Date(base.year, base.month + delta, 1);
      return { year: d.getFullYear(), month: d.getMonth() };
    });
  }
  function buildMonthGrid(year, month) {
    const startWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }
  function itemsOnDate(date) {
    if (!date) return [];
    return scheduleWithDates.filter((s) => s.date && s.date.getFullYear() === date.getFullYear() && s.date.getMonth() === date.getMonth() && s.date.getDate() === date.getDate());
  }
  function isSameDate(a, b) {
    return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function prepPercent(catId) {
    const items = costs[catId] || [];
    if (items.length === 0) return null;
    const done = items.filter((i) => i.actual !== null && i.actual !== undefined).length;
    return Math.round((done / items.length) * 100);
  }

  // ---------- Cost item sheet ----------
  function openAddItem(categoryId) {
    if (categoryId) setSelectedCategory(categoryId);
    setEditingId(null);
    setFormName("");
    setFormEstimated("");
    setFormActual("");
    setFormPrincipal("");
    setFormRepaid("");
    setFormInterest("");
    setFormError("");
    setSheetMode("item");
    setSheetOpen(true);
  }
  function openEditItem(item, categoryId) {
    const catId = categoryId || selectedCategory;
    if (categoryId) setSelectedCategory(categoryId);
    setEditingId(item.id);
    const cat = categoryOf(catId);
    if (cat && cat.kind === "installment") {
      setFormName(item.label ?? "");
      setFormPrincipal(item.principal ?? "");
      setFormRepaid(item.repaid ?? "");
      setFormInterest(item.interest ?? "");
    } else {
      setFormName(item.name ?? "");
      setFormEstimated(item.estimated ?? "");
      setFormActual(item.actual ?? "");
    }
    setFormError("");
    setSheetMode("item");
    setSheetOpen(true);
  }
  function saveItem() {
    const cat = categoryOf(selectedCategory);
    const isInstallment = cat && cat.kind === "installment";

    if (!formName.trim()) {
      setFormError(isInstallment ? "구분을 입력해주세요" : "항목 이름을 입력해주세요");
      return;
    }

    if (isInstallment) {
      for (const v of [formPrincipal, formRepaid, formInterest]) {
        if (v !== "" && isNaN(Number(v))) {
          setFormError("숫자만 입력해주세요");
          return;
        }
      }
      setCosts((prev) => {
        const list = [...(prev[selectedCategory] || [])];
        const payload = {
          label: formName.trim(),
          principal: formPrincipal === "" ? 0 : Number(formPrincipal),
          repaid: formRepaid === "" ? 0 : Number(formRepaid),
          interest: formInterest === "" ? 0 : Number(formInterest),
          updatedBy: myName || null,
        };
        if (editingId) {
          const idx = list.findIndex((i) => i.id === editingId);
          list[idx] = { ...list[idx], ...payload };
        } else {
          list.push({ id: "i" + Date.now(), ...payload });
        }
        return { ...prev, [selectedCategory]: list };
      });
      setSheetOpen(false);
      return;
    }

    if (formEstimated !== "" && isNaN(Number(formEstimated))) {
      setFormError("숫자만 입력해주세요");
      return;
    }
    if (formActual !== "" && isNaN(Number(formActual))) {
      setFormError("숫자만 입력해주세요");
      return;
    }
    setCosts((prev) => {
      const list = [...(prev[selectedCategory] || [])];
      const payload = {
        name: formName.trim(),
        estimated: formEstimated === "" ? 0 : Number(formEstimated),
        actual: formActual === "" ? null : Number(formActual),
        updatedBy: myName || null,
      };
      if (editingId) {
        const idx = list.findIndex((i) => i.id === editingId);
        list[idx] = { ...list[idx], ...payload };
      } else {
        list.push({ id: "i" + Date.now(), ...payload });
      }
      return { ...prev, [selectedCategory]: list };
    });

  // ---------- Reference photos (마음에 드는 것 찍어두기, 예산에는 안 잡힘) ----------
  function openAddRef() {

    setRefPrice("");
    setRefMemo("");
    setRefError("");
    setRefSheetOpen(true);
  }
  function handleRefFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setRefError("");
    setRefPhotoFile(file);
    const reader = new FileReader();
    reader.onload = () => setRefPhoto(reader.result); // 미리보기용 (업로드 전 화면에만 씀)
    reader.onerror = () => setRefError("사진을 불러오지 못했어요. 다시 시도해주세요.");
    reader.readAsDataURL(file);
  }
  async function saveRef() {
    if (!refPhoto || !refPhotoFile) {
      setRefError("사진을 먼저 찍거나 선택해주세요");
      return;
    }
    if (refPrice !== "" && isNaN(Number(refPrice))) {
      setRefError("가격은 숫자만 입력해주세요");
      return;
    }
    setRefUploading(true);
    setRefError("");
    try {
      const url = await uploadPhoto(selectedCategory, refPhotoFile);
      setRefs((prev) => ({
        ...prev,
        [selectedCategory]: [
          ...(prev[selectedCategory] || []),
          { id: "r" + Date.now(), photo: url, price: refPrice === "" ? null : Number(refPrice), memo: refMemo.trim() },
        ],
      }));
      setRefUploading(false);
      setRefSheetOpen(false);
    } catch (err) {
      setRefUploading(false);
      setRefError("업로드에 실패했어요. 다시 시도해주세요.");
    }
  }
  function deleteRef(id) {
    setRefs((prev) => ({ ...prev, [selectedCategory]: (prev[selectedCategory] || []).filter((r) => r.id !== id) }));
    setRefViewing(null);
  }
  function convertRefToItem(ref) {
    setCosts((prev) => ({
      ...prev,
      [selectedCategory]: [...(prev[selectedCategory] || []), { id: "i" + Date.now(), name: ref.memo || "구매 예정", estimated: ref.price || 0, actual: null }],

    setSchedule((prev) => [

              <button onClick={confirm.onConfirm} style={{ flex: 1, padding: 12, background: T.accent, border: "none", borderRadius: 8, fontWeight: 600, cursor: "pointer", color: "#fff" }}>
                확인
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const backBtnStyle = { display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", color: T.ink, fontWeight: 700, fontSize: 16, cursor: "pointer", padding: 0 };
const addBtnStyle = { width: 32, height: 32, borderRadius: 8, background: T.accentSoft, border: `1px solid ${T.accent}`, color: T.accent, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" };
const inputStyle = { padding: 14, borderRadius: 10, border: `1px solid ${T.rule}`, fontSize: 14, outline: "none" };


const STORAGE_KEY = "moveplan_household_code";
const NAME_KEY = "moveplan_my_name";
const ET = { paper: "#F7FAF8", ink: "#1F2D24", muted: "#6B7C72", rule: "#DDE7E1", accent: "#1E5B46", accentSoft: "rgba(30,91,70,0.08)", danger: "#B3554A" };

function AppRoot() {
  const [uid, setUid] = useState(null);
  const [authError, setAuthError] = useState("");

  const [householdCode, setHouseholdCode] = useState(null);
  const [myName, setMyNameState] = useState("");
  const [entryMode, setEntryMode] = useState("choice"); // choice | join
  const [joinCodeInput, setJoinCodeInput] = useState("");
  const [entryError, setEntryError] = useState("");
  const [entryLoading, setEntryLoading] = useState(false);

  const [loaded, setLoaded] = useState(false);
  const [moveInDate, setMoveInDate] = useState(null);
  const [costs, setCosts] = useState(EMPTY_DATA.costs);
  const [totalContractPrice, setTotalContractPrice] = useState("");
  const [schedule, setSchedule] = useState([]);
  const [refs, setRefs] = useState({});

  const lastPushedRef = useRef("");
  const pushTimerRef = useRef(null);

  // 1) 익명 인증
  useEffect(() => {
    ensureAnonymousAuth()
      .then((user) => setUid(user.uid))
      .catch((err) => setAuthError(err.message || "인증에 실패했어요"));
  }, []);

  // 저장된 가족 코드가 있으면 자동 재접속
  useEffect(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) setHouseholdCode(saved);
    const savedName = localStorage.getItem(NAME_KEY);
    if (savedName) setMyNameState(savedName);
  }, []);

  const setMyName = useCallback((name) => {
    setMyNameState(name);
    localStorage.setItem(NAME_KEY, name);
  }, []);

  // 3) 가족 코드가 정해지면 Firestore 구독 시작
  useEffect(() => {
    if (!householdCode) return;
    setLoaded(false);
    const unsub = subscribeHousehold(
      householdCode,
      (data) => {
        const payload = {
          moveInDate: data.moveInDate ?? null,
          totalContractPrice: data.totalContractPrice ?? "",
          costs: data.costs ?? EMPTY_DATA.costs,
          schedule: data.schedule ?? [],
          refs: data.refs ?? {},
        };
        const serialized = JSON.stringify(payload);
        // 방금 우리가 직접 쓴 내용의 메아리라면 무시 (불필요한 재렌더/깜빡임 방지)
        if (serialized === lastPushedRef.current) return;
        setMoveInDate(payload.moveInDate);
        setTotalContractPrice(payload.totalContractPrice);
        setCosts(payload.costs);
        setSchedule(payload.schedule);
        setRefs(payload.refs);
        setLoaded(true);
      },
      (err) => setEntryError(err.message || "동기화 중 오류가 발생했어요")
    );
    return () => unsub();
  }, [householdCode]);

  // 4) 로컬 상태가 바뀌면 (디바운스해서) Firestore에 반영
  useEffect(() => {
    if (!householdCode || !loaded) return;
    const payload = { moveInDate, totalContractPrice, costs, schedule, refs };
    const serialized = JSON.stringify(payload);
    if (serialized === lastPushedRef.current) return;

    if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
    pushTimerRef.current = setTimeout(() => {
      lastPushedRef.current = serialized;
      pushHouseholdUpdate(householdCode, payload).catch(() => {
        // 실패해도 로컬 화면은 그대로 유지 - 다음 변경 때 다시 시도됨
      });
    }, 500);

    return () => clearTimeout(pushTimerRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [moveInDate, totalContractPrice, costs, schedule, refs, householdCode, loaded]);

  const uploadPhoto = useCallback(
    (categoryId, file) => uploadRefPhoto(householdCode, categoryId, file),
    [householdCode]
  );

  async function handleCreateNew() {
    if (!uid) return;
    setEntryLoading(true);
    setEntryError("");
    try {
      const code = generateHouseholdCode();
      await createHousehold(code, uid);
      localStorage.setItem(STORAGE_KEY, code);
      setHouseholdCode(code);
    } catch (e) {
      setEntryError(e.message || "시작하지 못했어요. 다시 시도해주세요.");
    } finally {
      setEntryLoading(false);
    }
  }

  async function handleJoin() {
    const code = joinCodeInput.trim().toUpperCase();
    if (!code) {
      setEntryError("코드를 입력해주세요");
      return;
    }
    if (!uid) return;
    setEntryLoading(true);
    setEntryError("");
    try {
      await joinHousehold(code, uid);
      localStorage.setItem(STORAGE_KEY, code);
      setHouseholdCode(code);
    } catch (e) {
      setEntryError(e.message || "참여하지 못했어요. 코드를 다시 확인해주세요.");
    } finally {
      setEntryLoading(false);
    }
  }

  function handleLeaveHousehold() {
    localStorage.removeItem(STORAGE_KEY);
    setHouseholdCode(null);
    setLoaded(false);
    setEntryMode("choice");
    setJoinCodeInput("");
    setEntryError("");
  }

  // ---- 인증 대기 ----
  if (!uid && !authError) {
    return <CenterMessage text="시작하는 중..." />;
  }
  if (authError) {
    return <CenterMessage text={`인증 오류: ${authError}`} isError />;
  }

  // ---- 가족 코드 선택 화면 ----
  if (!householdCode) {
    return (
      <div style={{ maxWidth: 420, margin: "0 auto", minHeight: "100vh", background: ET.paper, display: "flex", flexDirection: "column", padding: "64px 24px 24px", fontFamily: "'Geist', system-ui, sans-serif" }}>
        <p style={{ fontSize: 12, letterSpacing: "0.14em", color: ET.muted, fontFamily: "monospace", marginBottom: 8 }}>MOVEPLAN</p>
        <h1 style={{ fontSize: 24, fontWeight: 700, color: ET.ink, marginBottom: 32 }}>
          {entryMode === "choice" ? "시작해볼까요?" : "가족 코드를 입력해주세요"}
        </h1>

        {entryMode === "choice" ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <button onClick={handleCreateNew} disabled={entryLoading} style={primaryBtn}>
              {entryLoading ? "만드는 중..." : "새로 시작하기"}
            </button>
            <button onClick={() => setEntryMode("join")} style={secondaryBtn}>
              가족 코드로 참여하기
            </button>
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <input
              value={joinCodeInput}
              onChange={(e) => setJoinCodeInput(e.target.value.toUpperCase())}
              placeholder="예: A3F9K2"
              maxLength={6}
              style={{ padding: 16, fontSize: 18, letterSpacing: "0.1em", textAlign: "center", border: `1px solid ${ET.rule}`, borderRadius: 10, outline: "none" }}
            />
            <button onClick={handleJoin} disabled={entryLoading} style={primaryBtn}>
              {entryLoading ? "참여하는 중..." : "참여하기"}
            </button>
            <button onClick={() => { setEntryMode("choice"); setEntryError(""); }} style={{ background: "none", border: "none", color: ET.muted, fontSize: 13, cursor: "pointer" }}>
              뒤로
            </button>
          </div>
        )}

        {entryError && <p style={{ color: ET.danger, fontSize: 13, marginTop: 16 }}>{entryError}</p>}
      </div>
    );
  }

  // ---- 로딩 중 (Firestore 첫 데이터 대기) ----
  if (!loaded) {
    return <CenterMessage text="불러오는 중..." />;
  }

  return (
    <MoveplanApp
      moveInDate={moveInDate}
      setMoveInDate={setMoveInDate}
      costs={costs}
      setCosts={setCosts}
      totalContractPrice={totalContractPrice}
      setTotalContractPrice={setTotalContractPrice}
      schedule={schedule}
      setSchedule={setSchedule}
      refs={refs}
      setRefs={setRefs}
      uploadPhoto={uploadPhoto}
      householdCode={householdCode}
      onLeaveHousehold={handleLeaveHousehold}
      myName={myName}
      setMyName={setMyName}
    />
  );
}

function CenterMessage({ text, isError }) {
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: ET.paper, fontFamily: "'Geist', system-ui, sans-serif" }}>
      <p style={{ color: isError ? ET.danger : ET.muted, fontSize: 14 }}>{text}</p>
    </div>
  );
}

const primaryBtn = { padding: 16, borderRadius: 10, border: "none", background: ET.accent, color: "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer" };
const secondaryBtn = { padding: 16, borderRadius: 10, border: `1px solid ${ET.accent}`, background: "#fff", color: ET.accent, fontSize: 15, fontWeight: 600, cursor: "pointer" };


// ============================================================
// 렌더
// ============================================================
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AppRoot />);


</script>
</body>
</html>
